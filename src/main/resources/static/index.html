<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Adyen Drop-in - PayPal Demo</title>
  <link rel="stylesheet"
    href="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.57.0/adyen.css" />
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #dropin-container { max-width: 480px; margin: 20px auto; }
  </style>
</head>
<body>
  <h2>Adyen Drop-in — PayPal demo</h2>
  <p>This demo will show PayPal automatically when enabled for your Adyen merchant account and when using a supported device/browser.</p>

  
<div>
  
<h3>Shopper & Recurring Details</h3>
<label>
  Shopper Reference:
  <input id="shopperRef" value="SHOPPER_123"/>
</label>
<br/>
<label>
  Recurring Processing Model:
  <select id="recurringModel">
    <option value="CardOnFile">CardOnFile</option>
    <option value="Subscription">Subscription</option>
    <option value="UnscheduledCardOnFile">UnscheduledCardOnFile</option>
  </select>
</label>
<br/><br/>
<button id="loadTokens">Load Stored Payment Methods</button>

<h3>Saved payment methods</h3>

  <ul id="tokens"></ul>
</div>
<div id="dropin-container"></div>


  <script src="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.57.0/adyen.js"></script>
  <script>
    async function initCheckout() {
      // fetch paymentMethods from our backend
      const pmResp = await fetch('/api/paymentMethods', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ merchantAccount: 'OnebillSoftwareECOM' }) // backend will inject merchantAccount if empty
      }).then(r => r.json());

      const clientKey = "test_2KQKSDJKZBB7ZMAP5DPIIHPPJQKSQLW5"; // '<REPLACE_WITH_CLIENT_KEY>';
      const environment = 'test'; // 'test' or 'live'

      
// Fetch stored payment methods (tokens)

document.getElementById('loadTokens').onclick = async () => {
  document.getElementById('tokens').innerHTML = '';
  const shopperReference = document.getElementById('shopperRef').value;
  const recurringModel = document.getElementById('recurringModel').value;

  const storedResp = await fetch('/api/storedPaymentMethods', {

  method: 'POST',
  headers: {'Content-Type':'application/json'},
  body: JSON.stringify({
    shopperReference: shopperReference,
    recurringProcessingModel: recurringModel
  })
}).then(r => r.json());

const tokenList = document.getElementById('tokens');
if (storedResp.storedPaymentMethods) {
  storedResp.storedPaymentMethods.forEach(pm => {
    const shopperReference = document.getElementById('shopperRef').value;
    const recurringModel = document.getElementById('recurringModel').value;

    const li = document.createElement('li');
    li.innerHTML = pm.brand + ' **** ' + pm.lastFour +
      ' <button>Pay</button>';
    li.querySelector('button').onclick = async () => {
      const res = await fetch('/api/payments', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          shopperReference: shopperReference,
          recurringProcessingModel: recurringModel,
          paymentMethod: {
            type: 'scheme',
            storedPaymentMethodId: pm.id
          },
          amount: { currency: 'USD', value: 1000 },
          reference: 'TOKEN_PAY_' + Date.now(),
          returnUrl: window.location.origin + '/result'
        })
      }).then(r => r.json());

      if (res.action) {
        checkout.handleAction(res.action);
      } else {
        alert('Token payment result: ' + res.resultCode);
      }
    };
    tokenList.appendChild(li);
  });
};
}

const checkout = await AdyenCheckout({

        environment: environment === 'live' ? 'live' : 'test',
        clientKey: clientKey,
        paymentMethodsResponse: pmResp,
        onSubmit: async (state, dropin) => {
          // send payment creation to backend
          const res = await fetch('/api/payments', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              paymentMethod: state.data.paymentMethod,
              amount: { currency: 'USD', value: 1000 },
              reference: 'ORDER-' + Date.now(),
              returnUrl: window.location.origin + '/result'
            })
          }).then(r => r.json());

          if (res.action) {
            dropin.handleAction(res.action);
          } else if (res.resultCode) {
            // show result
            alert('Result: ' + JSON.stringify(res));
          } else {
            console.error(res);
            alert('Unexpected response - see console');
          }
        },


        onAdditionalDetails: async (state, dropin) => {
            const res = await fetch('/api/details', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(state.data)
            }).then(r => r.json());
          
            // ✅ ONLY call handleAction if an action exists
            if (res.action) {
              dropin.handleAction(res.action);
            } else if (res.resultCode) {
              // ✅ FINAL result — payment is complete
              console.log("Payment result:", JSON.stringify(res));
          
              if (res.resultCode === "Authorised") {
                alert("Payment successful!");
              } else {
                alert("Payment failed: " + res.resultCode);
              }
            } else {
              console.error("Unexpected /details response", res);
            }
      }
      });

      checkout.create('dropin').mount('#dropin-container');
    }

    initCheckout();
  </script>
</body>
</html>
