<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Adyen Drop-in – Token Capture & Token Pay</title>

  <link rel="stylesheet"
        href="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.57.0/adyen.css"/>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .section { margin-top: 25px; padding: 15px; border: 1px solid #ddd; }
    label { display: block; margin-top: 10px; }
    button { margin-top: 10px; }
  </style>
</head>

<body>

<h2>Adyen Drop-in – Token Demo</h2>

<div class="section">
  <h3>Captured Token from Adyen</h3>
  <p>Recurring / Token Reference: <b id="capturedToken">-</b></p>
</div>

<div class="section">
  <h3>Pay using Token</h3>
  <label>
    Stored Payment Method ID (token):
    <input id="tokenInput" style="width: 360px"/>
  </label>
  <button id="payWithToken">Pay with Token</button>
</div>

<div class="section">
  <h3>New Payment (Drop-in)</h3>
  <div id="dropin-container"></div>
</div>

<script src="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.57.0/adyen.js"></script>

<script>
(async function () {

  const paymentMethodsResponse = await fetch("/api/paymentMethods", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({})
  }).then(r => r.json());

  const checkout = await AdyenCheckout({
    environment: "test",
    clientKey: "test_2KQKSDJKZBB7ZMAP5DPIIHPPJQKSQLW5",
    paymentMethodsResponse,

    onSubmit: async (state, dropin) => {

      const payload = {
        paymentMethod: state.data.paymentMethod,
        amount: { currency: "USD", value: 1000 },
        reference: "ORDER_" + Date.now(),
        returnUrl: window.location.origin + "/result",
        storePaymentMethod: true,
        recurringProcessingModel: "CardOnFile"
      };

      const res = await fetch("/api/payments", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      }).then(r => r.json());

      captureToken(res);

      if (res.action) {
        dropin.handleAction(res.action);
      } else {
        alert("Payment result: " + res.resultCode);
      }
    },

    onAdditionalDetails: async (state, dropin) => {

      const res = await fetch("/api/details", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(state.data)
      }).then(r => r.json());

      captureToken(res);

      if (res.action) {
        dropin.handleAction(res.action);
      } else {
        alert("Payment result: " + res.resultCode);
      }
    }
  });

  checkout.create("dropin").mount("#dropin-container");

  document.getElementById("payWithToken").onclick = async () => {

    const token=document.getElementById("tokenInput").value;
    if(!token){ alert("Please enter token"); return; }

    const payload={
      paymentMethod:{ type:"scheme", storedPaymentMethodId: token },
      amount:{ currency:"USD", value:1000 },
      reference:"TOKEN_PAY_"+Date.now(),
      returnUrl: window.location.origin + "/result",
      recurringProcessingModel:"CardOnFile"
    };

    const res = await fetch("/api/payments", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    }).then(r=>r.json());

    captureToken(res);

    if(res.action){
      checkout.handleAction(res.action);
    }else{
      alert("Token payment result: "+res.resultCode);
    }
  };

  function captureToken(res){
    if(res.additionalData &&
       res.additionalData["recurring.recurringDetailReference"]){
      const token=res.additionalData["recurring.recurringDetailReference"];
      document.getElementById("capturedToken").innerText=token;
      document.getElementById("tokenInput").value=token;
    }
  }

})();
</script>

</body>
</html>
